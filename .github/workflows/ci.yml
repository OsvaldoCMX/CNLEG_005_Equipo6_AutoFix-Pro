name: CI Business Logic
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Ruff (errores y estilo)
        run: ruff check src tests
      - name: Pruebas y cobertura (minimo 80 %)
        run: pytest -v --cov=src --cov-report=term-missing --cov-report=html --cov-fail-under=80
      - name: Compilar src
        run: python -m compileall -q src
      - name: Guardar reporte HTML y matrices
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura-y-matrices
          path: |
            htmlcov/
            reportes/
